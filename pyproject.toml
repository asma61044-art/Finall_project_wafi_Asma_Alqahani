[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafi"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9","pytest-cov>=5,<6","httpx>=0.27,<1","ruff>=0.6,<1","mypy>=1.11,<2","import-linter>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=wafi --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"

[tool.importlinter]
root_package = "wafi"

[[tool.importlinter.contracts]]
name = "domain has no outer-layer imports"
type = "layers"
layers = ["wafi.domain","wafi.service","wafi.adapters","wafi.api"]
