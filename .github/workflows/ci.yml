name: CI
on: [push, pull_request]
permissions:
  contents: read
  packages: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test
  image:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wafi:${{ github.sha }} .
      - run: docker run -d --name wafi -p 8000:8000 wafi:${{ github.sha }}
      - run: |
          for i in {1..30}; do curl --fail http://localhost:8000/ready && exit 0; sleep 1; done; exit 1
      - run: curl --fail -X POST http://localhost:8000/v1/predict -H 'Content-Type: application/json' -d '{"ticket_id":"CI-1","text":"All users cannot access the service"}'
      - if: always()
        run: docker rm -f wafi
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wafi:${{ github.sha }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
